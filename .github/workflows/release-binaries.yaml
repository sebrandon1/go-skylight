name: Release binaries

on:
  release:
    types: [published]

permissions: read-all

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          BINARY_NAME=skylight
          OUTPUT="dist/${BINARY_NAME}"
          go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" -o "$OUTPUT" .

      - name: Package
        run: |
          set -euo pipefail
          BINARY_NAME=skylight
          TAG="${GITHUB_REF_NAME}"
          PKG_NAME="${BINARY_NAME}_${TAG}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p dist/pkg
          (cd dist && tar -czf "pkg/${PKG_NAME}.tar.gz" "${BINARY_NAME}")

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: skylight_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/pkg/*
          if-no-files-found: error

  upload:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Show downloaded files
        run: ls -laR dist | cat

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: dist/sbom.cyclonedx.json
          artifact-name: sbom.cyclonedx.json

      - name: Attach assets to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/sbom.cyclonedx.json
