name: Pre-Main Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'

permissions: read-all

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache-dependency-path: go.sum

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.4
        args: --timeout=5m

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.26.7']
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache-dependency-path: go.sum

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      # Single Go version in the matrix, so only the OS needs matching.
      # A pinned go-version comparison here silently never matched ('1.26.x' vs '1.26.6').
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella

    - name: Check coverage threshold
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26.x'
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
        echo "Total coverage: ${COVERAGE}%"
        awk -v c="$COVERAGE" 'BEGIN { if (c+0 < 90) { print "Coverage " c "% is below 90% threshold"; exit 1 } }'

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache-dependency-path: go.sum

    - name: Verify go.mod/go.sum are tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Build binary
      run: |
        VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
        go build -v -ldflags "-X main.Version=${VERSION}" -o bin/go-skylight .
        ./bin/go-skylight --version

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache-dependency-path: go.sum

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

    - name: Run govulncheck
      run: govulncheck ./...
